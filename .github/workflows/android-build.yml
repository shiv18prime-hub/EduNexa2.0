name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, "fix/**" ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: edunexa-debug-keystore-v1
      - name: Create debug keystore if missing
        run: |
          mkdir -p ~/.config/.android
          if [ ! -f ~/.config/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.config/.android/debug.keystore \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=EduNexa,C=IN"
          fi
      - name: Print debug signing fingerprints
        run: gradle signingReport
      - name: Build debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Verify APK Google OAuth registration
        if: github.event_name != 'pull_request'
        id: oauth_registration
        # The default branch can have an older branch-scoped debug key. Never
        # publish an APK with that key, but keep the source/test workflow green
        # and report the signing mismatch clearly for owner follow-up.
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        run: python3 scripts/verify-google-signing.py app/build/outputs/apk/debug/app-debug.apk app/google-services.json
      - name: Explain why the main APK was not published
        if: github.ref == 'refs/heads/main' && steps.oauth_registration.outcome == 'failure'
        run: echo "::warning::Android build passed, but APK upload was skipped because this branch's debug signing certificate is not registered with Firebase. Use the verified APK from a successful fix/** push or register the certificate with the Firebase project owner."
      - name: Check Android lint
        run: gradle lintDebug --stacktrace
      - name: Print lint errors
        if: always()
        run: |
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        # PR-scoped caches can contain a different, unregistered debug key.
        # Only publish APKs whose actual signature passed the Firebase check.
        if: success() && github.event_name != 'pull_request' && steps.oauth_registration.outcome == 'success'
        with:
          name: EduNexa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm test
      - run: npm run build:web
